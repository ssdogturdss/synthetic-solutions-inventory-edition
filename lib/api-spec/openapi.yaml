components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BackupHealth:
      type: object
      required: [overallStatus, maxAgeHours, latestRun, localCopy, offsiteCopy, latestCheck, lastRestoreDrillAt, recoveryGuidance]
      properties:
        overallStatus:
          type: string
          enum: [healthy, degraded, unknown]
        maxAgeHours:
          type: integer
          minimum: 1
        latestRun:
          $ref: "#/components/schemas/BackupRunMetadata"
        localCopy:
          $ref: "#/components/schemas/BackupCopyMetadata"
        offsiteCopy:
          $ref: "#/components/schemas/BackupCopyMetadata"
        latestCheck:
          $ref: "#/components/schemas/BackupCheckMetadata"
        lastRestoreDrillAt:
          type: ["string", "null"]
          format: date-time
        recoveryGuidance:
          type: string

    BackupRunMetadata:
      type: object
      required: [status, finishedAt, message]
      properties:
        status:
          type: string
          enum: [success, failure, unknown]
        finishedAt:
          type: ["string", "null"]
          format: date-time
        message:
          type: ["string", "null"]

    BackupCopyMetadata:
      type: object
      required: [status, ageSeconds]
      properties:
        status:
          type: string
          enum: [fresh, stale, missing, unknown]
        ageSeconds:
          type: ["integer", "null"]
          minimum: 0

    BackupCheckMetadata:
      type: object
      required: [status, finishedAt, ageSeconds]
      properties:
        status:
          type: string
          enum: [fresh, stale, unknown]
        finishedAt:
          type: ["string", "null"]
          format: date-time
        ageSeconds:
          type: ["integer", "null"]
          minimum: 0

    BackupPushEventInput:
      type: object
      additionalProperties: false
      required: [issue, state]
      properties:
        issue:
          type: string
          enum: [backup_run, backup_freshness]
        state:
          type: string
          enum: [alert, healthy]

    BackupPushEventAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true

    NotificationPreferencesInput:
      type: object
      additionalProperties: false
      required: [backupEnabled, inventoryEnabled]
      properties:
        backupEnabled:
          type: boolean
        inventoryEnabled:
          type: boolean

    NotificationDevicePreferencesUpdateInput:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          $ref: "#/components/schemas/NotificationPreferencesInput"

    ExpoPushRegistration:
      type: object
      additionalProperties: false
      required: [expoPushToken]
      properties:
        expoPushToken:
          type: string
          pattern: "^(Expo|Exponent)PushToken\\[[^\\]]+\\]$"

    WebPushRegistration:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          pattern: "^https://"
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string

    NotificationDeviceRegistrationInput:
      type: object
      additionalProperties: false
      required: [platform, subscription, preferences]
      properties:
        platform:
          type: string
          enum: [expo, web]
        subscription:
          oneOf:
            - $ref: "#/components/schemas/ExpoPushRegistration"
            - $ref: "#/components/schemas/WebPushRegistration"
        preferences:
          $ref: "#/components/schemas/NotificationPreferencesInput"

    NotificationDevice:
      type: object
      required: [id, platform, backupEnabled, inventoryEnabled, isActive, createdAt]
      properties:
        id:
          type: integer
        platform:
          type: string
          enum: [expo, web]
        backupEnabled:
          type: boolean
        inventoryEnabled:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationCapabilities:
      type: object
      required: [webPushConfigured, webPushPublicKey]
      properties:
        webPushConfigured:
          type: boolean
        webPushPublicKey:
          type: ["string", "null"]

    NotificationDeviceList:
      type: object
      required: [devices, capabilities]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDevice"
        capabilities:
          $ref: "#/components/schemas/NotificationCapabilities"

    NotificationDeviceResponse:
      type: object
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/NotificationDevice"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # Auth
    LoginInput:
      type: object
      required: [pin]
      properties:
        userId:
          type: ["integer", "null"]
          description: User ID (optional if providing name)
        name:
          type: ["string", "null"]
          description: User name for lookup
        pin:
          type: string
          description: PIN code

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, name, role, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, store_user]
        storeId:
          type: ["integer", "null"]
        biometricEnabled:
          type: boolean
        isActive:
          type: boolean
