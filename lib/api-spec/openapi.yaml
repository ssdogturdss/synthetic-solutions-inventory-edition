  # Users
  /warehouse-movements:
    get:
      operationId: listWarehouseMovements
      tags: [warehouses]
      summary: List warehouse stock movements
      security:
        - bearerAuth: []
      parameters:
        - name: warehouseId
          in: query
          schema:
            type: integer
        - name: productId
          in: query
          schema:
            type: integer
        - name: movementType
          in: query
          schema:
            type: string
            enum: [receipt, transfer, adjustment]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Warehouse stock movement ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WarehouseMovement"
    post:
      operationId: createWarehouseMovement
      tags: [warehouses]
      summary: Record a warehouse receipt, transfer, or adjustment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseMovementInput"
      responses:
        "201":
          description: Movement recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseMovementResponse"

  /warehouse-transfers:
    post:
      operationId: createWarehouseTransfer
      tags: [warehouses]
      summary: Transfer stock from a warehouse to a store (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseTransferInput"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseTransferResponse"
        "409":
