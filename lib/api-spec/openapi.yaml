openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Synthetic Solutions Inventory Edition API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: backups
    description: Backup health metadata
  - name: notifications
    description: Push notification registrations and preferences
  - name: auth
    description: Authentication
  - name: stores
    description: Store management
  - name: warehouses
    description: Warehouse management
  - name: users
    description: User management
  - name: categories
    description: Category management
  - name: products
    description: Product/chemical master
  - name: inventory
    description: Inventory count sessions
  - name: receiving
    description: Receiving inventory
  - name: chemical-usage
    description: Online chemical usage tracking
  - name: reports
    description: Reporting and analytics
  - name: ai
    description: AI assistant and configuration
  - name: dashboard
    description: Dashboard summary
  - name: audit
    description: Audit logs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /backup/health:
    get:
      operationId: getBackupHealth
      tags: [backups]
      summary: Get backup health metadata (admin only)
      description: Returns backup freshness metadata and the timestamp of the last successful restore verification. Missing, unreadable, malformed, or oversized status records are reported as unknown with recovery guidance. Restored database contents, dump contents, status-file contents, and credentials are never returned.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Backup health metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupHealth"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backup/events:
    post:
      operationId: submitBackupPushEvent
      tags: [backups]
      summary: Submit a backup alert state transition
      description: Machine-to-machine endpoint used by the backup host. The shared secret is accepted only in a request header and is never returned.
      parameters:
        - in: header
          name: X-Backup-Push-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupPushEventInput"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPushEventAccepted"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid shared token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Backup event intake is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/devices:
    get:
      operationId: getNotificationDevices
      tags: [notifications]
      summary: List the current user's push registrations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registered devices and available browser push capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeviceList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: registerNotificationDevice
      tags: [notifications]
      summary: Register or update a push registration for the current device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDeviceRegistrationInput"
      responses:
        "201":
          description: Device registration saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeviceResponse"
        "400":
          description: Unsupported platform or invalid registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/devices/{id}:
    patch:
      operationId: updateNotificationDevice
      tags: [notifications]
      summary: Update alert preferences for a registered device
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDevicePreferencesUpdateInput"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeviceResponse"
        "400":
          description: Invalid device ID or preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Device registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeNotificationDevice
      tags: [notifications]
      summary: Remove a push registration owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Device registration removed
        "400":
          description: Invalid device ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Device registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: PIN login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
